name: Build Cloudstream Stable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease

      - name: Sign APK
        run: |
          mkdir signed
          keytool -genkeypair -alias key0 -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Cloudstream" -keypass password -keystore key.jks -storepass password

          APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)

          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore key.jks -storepass password -keypass password \
            "$APK" key0

          zipalign -v 4 "$APK" signed/Cloudstream-Stable.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: stable
          name: Cloudstream Stable Build
          files: signed/Cloudstream-Stable.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
